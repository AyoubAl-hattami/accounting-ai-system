services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./production.env
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2", "--proxy-headers", "--forwarded-allow-ips=*"]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
        VITE_PUBLIC_DEMO: "0"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "8080"

  edge:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - frontend
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN to the production DNS name}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/production/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:

# PostgreSQL is intentionally external and managed. Do not add development data
# or credentials here. A TLS-verified DATABASE_URL is injected through the
# operator-created, untracked production.env or the hosting secret manager.
# FastAPI trusts forwarded headers here only because it is not published and is
# reachable solely through the private Compose network and the two proxies.
