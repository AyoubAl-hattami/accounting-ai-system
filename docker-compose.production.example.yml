services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./production.env
    expose:
      - "8000"
    healthcheck:
      # /health/db, not /health: /health returns ok unconditionally and touches
      # nothing, so a backend that cannot reach PostgreSQL reported healthy,
      # frontend's depends_on released, and every request 500'd while restart
      # never fired.  /health/db executes SELECT 1 against the real pool.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/db', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # No command override: backend/Dockerfile's CMD already runs uvicorn with
    # --forwarded-allow-ips 127.0.0.1.  This file used to widen that to "*",
    # which told uvicorn to trust X-Forwarded-For from any peer and let a caller
    # choose its own request.client.host.

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
        VITE_PUBLIC_DEMO: "0"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "8080"

  edge:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - frontend
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN to the production DNS name}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/production/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:

# PostgreSQL is intentionally external and managed. Do not add development data
# or credentials here. A TLS-verified DATABASE_URL is injected through the
# operator-created, untracked production.env or the hosting secret manager.
# FastAPI trusts forwarded headers here only because it is not published and is
# reachable solely through the private Compose network and the two proxies.
