server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 10m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 60s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $proxy_add_x_forwarded_for appends this hop's peer to what arrived,
        # which is what lets the backend recover the real client.
        #
        # A caller cannot inject a value here.  Caddy OVERWRITES X-Forwarded-For
        # with the true peer before this hop ever sees it -- verified against
        # caddy:2.8-alpine with spoofed single values, chains, loopback and
        # twenty hops, all discarded -- and nothing but Caddy can reach this
        # server, because only the edge service publishes a port.
        #
        # uvicorn then walks the chain in REVERSE and takes the first address
        # not in --forwarded-allow-ips (proxy_headers.py:166-170).  It reads the
        # leftmost value only under the literal "*".  So the allow-list must
        # name every proxy hop: with only this server trusted, the reverse walk
        # stops at Caddy and every client resolves to Caddy's address.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
