name: Backend validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: backend-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-static-validation:
    name: Backend static validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DATABASE_URL: sqlite+pysqlite:///:memory:
      SECRET_KEY: ci-static-validation-secret-key-not-for-production
      AI_JOURNAL_PROVIDER: rules
      OPENAI_API_KEY: ""
      GEMINI_API_KEY: ""
      PYTHONPATH: ${{ github.workspace }}/backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile backend sources
        run: python -m compileall -q app

      - name: Run architecture guards
        run: >-
          python -m pytest -p no:cacheprovider
          tests/test_architecture_guards.py
          tests/test_fixture_readiness.py -v

      - name: Check for deleted accounting service references
        working-directory: .
        shell: bash
        run: |
          legacy_pattern="$(printf '%s%s' 'Account' 'Service')|$(printf '%s%s' 'account_' 'service')"
          legacy_pattern+="|$(printf '%s%s' 'Fiscal' 'Service')|$(printf '%s%s' 'fiscal_' 'service')"
          legacy_pattern+="|$(printf '%s%s' 'Journal' 'Service')|$(printf '%s%s' 'journal_' 'service')"
          legacy_pattern+="|$(printf '%s%s' 'Report' 'Service')|$(printf '%s%s' 'report_' 'service')"
          legacy_pattern+="|$(printf '%s%s' 'default_accounts_' 'service')|$(printf '%s%s' 'create_default_' 'accounts')"

          if git grep -n -E "$legacy_pattern" -- backend/app backend/tests docs README.md .github; then
            echo "::error::Deleted accounting service reference found."
            exit 1
          fi

          echo "No deleted accounting service references found."

  db-backed-readiness:
    name: PostgreSQL migration and API readiness
    needs: backend-static-validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/accounting_ai
      SECRET_KEY: ci-only-backend-validation-secret-key
      AI_JOURNAL_PROVIDER: rules
      OPENAI_API_KEY: ""
      GEMINI_API_KEY: ""
      ACCOUNTING_TEST_BASE_URL: http://127.0.0.1:8010
      PYTHONPATH: ${{ github.workspace }}/backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: accounting_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d accounting_ai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Apply and inspect migrations
        shell: bash
        run: |
          set -euo pipefail
          alembic upgrade head
          alembic current
          alembic heads

          head_count="$(alembic heads | grep -c '(head)')"
          if [ "$head_count" -ne 1 ]; then
            echo "::error::Expected one Alembic head, found $head_count."
            exit 1
          fi

      - name: Start API and run deterministic HTTP tests
        shell: bash
        run: |
          set -euo pipefail
          api_log="${RUNNER_TEMP}/accounting-api.log"
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8010 >"$api_log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT

          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8010/health/db >/dev/null; then
              ready=true
              break
            fi

            if ! kill -0 "$api_pid" 2>/dev/null; then
              echo "::error::FastAPI exited before becoming ready."
              cat "$api_log"
              exit 1
            fi

            sleep 1
          done

          if [ "$ready" != true ]; then
            echo "::error::FastAPI database health endpoint did not become ready."
            cat "$api_log"
            exit 1
          fi

          python -m pytest -p no:cacheprovider \
            tests/test_health.py \
            tests/test_auth.py \
            tests/test_auth_rate_limit.py \
            tests/test_password_policy.py \
            tests/test_protected_reports.py \
            tests/test_reports_smoke.py \
            tests/test_report_csv_exports.py \
            tests/test_report_pdf_exports.py \
            tests/test_default_accounts_seed.py \
            tests/test_protected_fiscal.py \
            tests/test_protected_accounts.py \
            tests/test_ai_status.py \
            tests/test_ai_suggestions.py \
            tests/test_fiscal_year_date_protection.py \
            tests/test_non_journal_audit_logs.py \
            tests/test_opening_balance_workflow.py \
            tests/test_protected_companies.py \
            tests/test_rbac_permission_matrix.py \
            tests/test_fiscal_management.py \
            tests/test_protected_audit_logs.py \
            tests/test_journal_lifecycle_policy.py \
            tests/api/test_company_user_invitations.py \
            tests/test_reset_script.py \
            tests/test_dashboard_net_income.py \
            tests/test_protected_company_users.py \
            tests/test_protected_journal_entries.py \
            tests/test_balance_sheet_multi_year.py \
            tests/test_invitation_lifecycle_integrity.py \
            tests/test_gemini_assistant.py \
            tests/test_assistant_conversations.py \
            tests/test_gemini_assistant_explain.py \
            tests/test_gemini_assistant_profit.py \
            tests/test_semantic_transaction.py \
            -v
