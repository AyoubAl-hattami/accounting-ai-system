name: Backend validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: backend-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-static-validation:
    name: Backend static validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DATABASE_URL: "sqlite+pysqlite:///:memory:"
      SECRET_KEY: ci-static-validation-secret-key-not-for-production
      AI_JOURNAL_PROVIDER: rules
      OPENAI_API_KEY: ""
      GEMINI_API_KEY: ""
      PYTHONPATH: ${{ github.workspace }}/backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check for placeholder-only directories
        working-directory: .
        run: python scripts/check_no_placeholder_dirs.py

      - name: Compile backend sources
        run: python -m compileall -q app

      - name: Run architecture guards
        run: >-
          python -m pytest -p no:cacheprovider
          tests/test_architecture_guards.py
          tests/test_fixture_readiness.py -v

      - name: Check for deleted accounting service references
        working-directory: .
        shell: bash
        run: |
          legacy_pattern="$(printf '%s%s' 'Account' 'Service')|$(printf '%s%s' 'account_' 'service')"
          legacy_pattern+="|$(printf '%s%s' 'Fiscal' 'Service')|$(printf '%s%s' 'fiscal_' 'service')"
          legacy_pattern+="|$(printf '%s%s' 'Journal' 'Service')|$(printf '%s%s' 'journal_' 'service')"
          legacy_pattern+="|$(printf '%s%s' 'Report' 'Service')|$(printf '%s%s' 'report_' 'service')"
          legacy_pattern+="|$(printf '%s%s' 'default_accounts_' 'service')|$(printf '%s%s' 'create_default_' 'accounts')"

          if git grep -n -E "$legacy_pattern" -- backend/app backend/tests docs README.md .github; then
            echo "::error::Deleted accounting service reference found."
            exit 1
          fi

          echo "No deleted accounting service references found."

  db-backed-readiness:
    name: PostgreSQL migration and API readiness
    needs: backend-static-validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/accounting_ai
      SECRET_KEY: ci-only-backend-validation-secret-key
      AI_JOURNAL_PROVIDER: rules
      OPENAI_API_KEY: ""
      GEMINI_API_KEY: ""
      ACCOUNTING_TEST_BASE_URL: http://127.0.0.1:8010
      PYTHONPATH: ${{ github.workspace }}/backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: accounting_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d accounting_ai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Apply and inspect migrations
        shell: bash
        run: |
          set -euo pipefail
          alembic upgrade head
          alembic current
          alembic heads

          head_count="$(alembic heads | grep -c '(head)')"
          if [ "$head_count" -ne 1 ]; then
            echo "::error::Expected one Alembic head, found $head_count."
            exit 1
          fi

      - name: Check models and migrations agree
        shell: bash
        run: |
          set -euo pipefail

          # Autogenerate against the database the previous step just migrated.
          # If the models and the schema agree, alembic emits an upgrade() whose
          # body is `pass`; anything else is drift.
          #
          # Two real defects in two sessions, both invisible to review:
          #   - a model column with no migration behind it
          #   - indexes created by raw DDL that no model declares, which makes
          #     the NEXT autogenerate emit drop_index for them. That one is the
          #     dangerous shape: it arrives disguised as routine tooling output.
          #
          # The generated file is deleted on the way out, including on failure,
          # so a drift check can never land in versions/.
          drift_id="cidriftcheck"
          trap 'rm -f alembic/versions/${drift_id}_*.py' EXIT

          alembic revision --autogenerate -m "ci drift check" --rev-id "$drift_id" >/dev/null

          generated="alembic/versions/${drift_id}_ci_drift_check.py"
          if [ ! -f "$generated" ]; then
            echo "::error::Expected alembic to generate ${generated}; it did not."
            exit 1
          fi

          # Everything between alembic's own marker comments, minus the
          # scaffolding it always emits. What survives is the operations it
          # wants to perform.
          operations="$(sed -n '/# ### commands auto generated by Alembic/,/# ### end Alembic commands ###/p' "$generated" | grep -vE '^[[:space:]]*(#|pass[[:space:]]*$|$)' || true)"

          if [ -n "$operations" ]; then
            echo "::error::Models and migrations disagree. Autogenerate wants to run:"
            echo "$operations"
            echo ""
            echo "Either a model changed without a migration, or a migration used"
            echo "raw DDL the models do not declare. Declare it in the model's"
            echo "__table_args__ so metadata matches the database."
            exit 1
          fi

          echo "Models and migrations agree: autogenerate produced no operations."

      - name: Start API and run deterministic HTTP tests
        shell: bash
        run: |
          set -euo pipefail
          api_log="${RUNNER_TEMP}/accounting-api.log"
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8010 >"$api_log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT

          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8010/health/db >/dev/null; then
              ready=true
              break
            fi

            if ! kill -0 "$api_pid" 2>/dev/null; then
              echo "::error::FastAPI exited before becoming ready."
              cat "$api_log"
              exit 1
            fi

            sleep 1
          done

          if [ "$ready" != true ]; then
            echo "::error::FastAPI database health endpoint did not become ready."
            cat "$api_log"
            exit 1
          fi

          python -m pytest -p no:cacheprovider -v
